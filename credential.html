<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSBF Digital Credential</title>
<style>
:root {
  --gold:#f5c242;
  --white:#ffffff;
  --navy:#123c73;
  --dark:#0b1f3a;
}
body {
  margin:0;
  font-family:system-ui,sans-serif;
  background:linear-gradient(135deg,var(--navy),var(--dark));
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card {
  width:350px;
  border-radius:25px;
  background:var(--white);
  padding:25px;
  text-align:center;
  box-shadow:0 15px 30px rgba(0,0,0,0.5);
  position:relative;
  color:#000;
}
.card::before {
  content:"GSBF";
  position:absolute;
  top:20px;
  right:20px;
  font-weight:bold;
  font-size:24px;
  color:var(--gold);
  opacity:0.2;
}
h2 {margin-top:0;color:var(--gold);font-size:20px;}
p {margin:5px 0;font-size:16px;}
.badge {
  margin-top:15px;
  display:inline-block;
  padding:8px 15px;
  background:var(--gold);
  border-radius:12px;
  font-weight:600;
  font-size:14px;
}
.copy-btn {
  margin-top:20px;
  padding:8px 16px;
  background:#0077b5;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}
</style>
</head>
<body>

<div class="card">
  <h2 id="credName">[Applicant Name]</h2>
  <p id="credTrack">[Program Track]</p>
  <p id="credCareer">Career Pathway: [Career Pathway]</p>
  <div class="badge" id="credIdentity">GSBF Signature Identity</div>
  <button class="copy-btn" onclick="copyCredential()">Copy Identity for LinkedIn</button>
</div>

<script>
let identity = localStorage.getItem('gsbfIdentity');

if(!identity){
  let applicants = JSON.parse(localStorage.getItem('gsbfApplicants') || '[]');
  if(applicants.length>0){
    let latest = applicants[applicants.length-1];
    document.getElementById('credName').textContent = latest.name;
    document.getElementById('credTrack').textContent = latest.track;
    document.getElementById('credCareer').textContent = latest.careerPath;
    identity = `${latest.name} | GSBF ${latest.track} | ${latest.careerPath}`;
  }
} else {
  const parts = identity.split('|').map(p=>p.trim());
  if(parts.length===3){
    document.getElementById('credName').textContent = parts[0];
    document.getElementById('credTrack').textContent = parts[1];
    document.getElementById('credCareer').textContent = parts[2];
  }
}
document.getElementById('credIdentity').textContent = identity || "GSBF Signature Identity";

function copyCredential(){
  const text = document.getElementById('credIdentity').textContent;
  navigator.clipboard.writeText(text);
  alert("✅ GSBF Identity copied! You can paste it on LinkedIn.");
}
</script>

</body>
</html>
