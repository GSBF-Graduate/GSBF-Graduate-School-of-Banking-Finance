<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSBF Digital Credential</title>
<style>
:root{
  --gold:#f5c242;
  --white:#ffffff;
  --navy:#0b1f3a;
  --blue:#123c73;
}
body{
  background:linear-gradient(135deg,var(--navy),var(--blue));
  font-family:system-ui,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.card{
  background:var(--white);
  color:#000;
  max-width:380px;
  width:100%;
  border-radius:20px;
  padding:30px;
  box-shadow:0 15px 30px rgba(0,0,0,0.3);
  position:relative;
  text-align:center;
}
.card::before{
  content:"GSBF";
  position:absolute;
  top:50%;
  left:50%;
  font-size:120px;
  font-weight:bold;
  color:var(--gold);
  opacity:0.05;
  transform:translate(-50%,-50%) rotate(-15deg);
  pointer-events:none;
}
h2{color:var(--gold); margin-bottom:10px;}
p{margin:8px 0; font-size:16px;}
.identity{
  font-weight:bold;
  color:#123c73;
  font-size:18px;
  margin-top:15px;
}
.btn{
  display:inline-block;
  padding:10px 20px;
  background:var(--gold);
  color:#000;
  border-radius:6px;
  font-weight:600;
  margin-top:20px;
  cursor:pointer;
  text-decoration:none;
}
</style>
</head>
<body>

<div class="card">
  <h2>GSBF Digital Credential</h2>
  <p>Certified Achievement</p>
  <h2 id="credName">[Applicant Name]</h2>
  <p id="credTrack">[Full Program Name]</p>
  <p>Career Pathway: <span id="credCareer">[Career Pathway]</span></p>
  <p class="identity" id="credSignature">[GSBF Signature Identity]</p>
  <a class="btn" id="downloadBtn">Download Credential</a>
</div>

<script>
// Load latest applicant from localStorage
let applicants = JSON.parse(localStorage.getItem('gsbfApplicants') || '[]');
if(applicants.length>0){
  let latest = applicants[applicants.length-1];
  document.getElementById('credName').textContent = latest.name;
  document.getElementById('credTrack').textContent = latest.track;
  document.getElementById('credCareer').textContent = latest.careerPath;
  document.getElementById('credSignature').textContent =
    `${latest.name} | GSBF ${latest.track.split(' — ')[0]} — ${latest.track.split(' — ')[1]} | ${latest.careerPath}`;
}

// Optional: download card as image
const downloadBtn = document.getElementById('downloadBtn');
downloadBtn.addEventListener('click', ()=>{
  import('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
  .then(()=> {
    html2canvas(document.querySelector('.card')).then(canvas=>{
      let link = document.createElement('a');
      link.download = `${applicants[applicants.length-1].name}_GSBF_Credential.png`;
      link.href = canvas.toDataURL();
      link.click();
    });
  });
});
</script>

</body>
</html>
