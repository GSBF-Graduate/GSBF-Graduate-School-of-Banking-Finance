<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSBF Student Dashboard</title>
<style>
:root{--gold:#f5c242;--green:#1db954;--soft:#cfd8e3;}
body{background:linear-gradient(135deg,#0b1f3a,#123c73);color:#fff;font-family:system-ui,sans-serif;padding:40px;}
.section{background:rgba(0,0,0,0.15);padding:40px;border-radius:10px;max-width:900px;margin:auto;}
h2{color:var(--gold);margin-bottom:20px;}
.card{background:rgba(255,255,255,0.05);padding:20px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);margin-bottom:20px;}
h3{color:var(--gold);}
.btn{display:inline-block;padding:12px 25px;background:var(--gold);color:#000;font-weight:600;border-radius:6px;text-decoration:none;margin-top:15px;cursor:pointer;}
</style>
</head>
<body>

<section class="section">
<h2>Student Dashboard Preview</h2>
<div id="dashboardGrid"></div>
<p style="margin-top:20px;"><a href="app.html" class="btn">Add New Applicant</a></p>
</section>

<script>
const dashboard = document.getElementById('dashboardGrid');
let applicants = JSON.parse(localStorage.getItem('gsbfApplicants') || '[]');

if(applicants.length===0){
  dashboard.innerHTML="<p>No applications yet.</p>";
}else{
  dashboard.innerHTML = applicants.map(a=>`
    <div class="card">
      <h3>${a.name} — ${a.track} — ${a.careerPath}</h3>
      <p>Finance Score: ${a.finance}/5</p>
      <p>Analysis Score: ${a.analysis}/5</p>
      <p>Motivation Score: ${a.motivation}/5</p>
      <p>Total Score: ${a.total}/15 (${a.percentage}%)</p>
      <p>Status: <strong style="color: var(--green)">${a.status}</strong></p>
      <p>GSBF Signature Identity: <strong>${a.name} | ${a.track} | ${a.careerPath}</strong></p>
    </div>
  `).join('');
}
</script>

</body>
</html>
