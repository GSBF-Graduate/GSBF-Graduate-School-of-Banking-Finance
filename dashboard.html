<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSBF Student Dashboard</title>
<style>

.section{background:rgba(0,0,0,0.15);padding:40px;border-radius:10px;max-width:900px;margin:auto;}
h2{color:var(--gold);margin-bottom:20px;}
.card{background:rgba(255,255,255,0.05);padding:20px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);margin-bottom:20px;}
h3{color:var(--gold);}
</style>
</head>
<body>

<section class="section">
<h2>Student Dashboard Preview</h2>

<p>Modules Completed: 3/5</p>

</div>

<div class="card">
<h3>CIP — Investment Professional</h3>
<p>Modules Completed: 2/5</p>
<p>Score: 65%</p>
<p>Status: <strong style="color: #f5c242">In Progress</strong></p>
</div>

<div class="card">
<h3>CAIP — Advanced Investment Practitioner</h3>
<p>Modules Completed: 0/5</p>

</section>

</body>
</html>
