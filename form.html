<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSBF Application Form</title>
<style>
:root {--gold:#f5c242;--green:#1db954;--soft:#cfd8e3;}
body{background:linear-gradient(135deg,#0b1f3a,#123c73);color:#fff;font-family:system-ui,sans-serif;padding:40px;}
.section{background:rgba(0,0,0,0.15);padding:40px;border-radius:10px;max-width:700px;margin:auto;}
h2{color:var(--gold);margin-bottom:20px;}
input,select{padding:8px;width:100%;margin-top:5px;border-radius:5px;border:1px solid #ccc;}
.btn{display:inline-block;padding:12px 25px;background:var(--gold);color:#000;font-weight:600;border-radius:6px;text-decoration:none;margin-top:15px;cursor:pointer;}
</style>
</head>
<body>

<section class="section">
<h2>GSBF Application Form</h2>
<form id="appForm">
<label>Full Name:<br><input type="text" name="name" required></label><br><br>
<label>Email:<br><input type="email" name="email" required></label><br><br>

<!-- Program Track -->
<label>Program Track:<br>
<select name="track" required>
  <option value="">Select Program Track</option>
  <option value="CFFA — Certified Finance Foundations Associate">CFFA — Certified Finance Foundations Associate</option>
  <option value="CIP — Certified Investment Professional">CIP — Certified Investment Professional</option>
  <option value="CAIP — Certified Advanced Investment Practitioner">CAIP — Certified Advanced Investment Practitioner</option>
</select>
</label><br><br>

<!-- Career Pathways -->
<label>Career Pathways:<br>
<select name="careerPath" required>
  <option value="">Select Career Pathway</option>
  <option value="Investment Banking (IB)">Investment Banking (IB)</option>
  <option value="Private Equity / Venture Capital (PE/VC)">Private Equity / Venture Capital (PE/VC)</option>
  <option value="Wealth Management (WM)">Wealth Management (WM)</option>
</select>
</label><br><br>

<label>Finance Knowledge (0–5):<br><input type="number" name="financeScore" min="0" max="5" required></label><br><br>
<label>Analytical Skills (0–5):<br><input type="number" name="analysisScore" min="0" max="5" required></label><br><br>
<label>Career Motivation (0–5):<br><input type="number" name="motivationScore" min="0" max="5" required></label><br><br>

<button type="submit" class="btn">Submit Application</button>
</form>

<div id="appResult" style="margin-top:20px;color:var(--gold);font-weight:600;"></div>
<p style="margin-top:20px;">
<a href="dashboard.html" class="btn">View Dashboard</a>
<a href="certificate.html" class="btn">View Certificate</a>
<a href="credential.html" class="btn">View Credential</a>
</p>
  <!-- Premium Gold CTA Button -->
<a href="about.html" class="cta-btn">About Us</a>

<style>
/* Premium Gold CTA Button */
.cta-btn {
  position: relative;              /* for shine animation */
  display: inline-block;           /* can be placed anywhere */
  padding: 16px 32px;
  background: linear-gradient(135deg, #f4c430, #e6b800); /* rich gold gradient */
  color: #000;
  font-weight: bold;
  font-size: 16px;
  text-decoration: none;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
  overflow: hidden;                /* hide shine overflow */
  transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
  cursor: pointer;
}

/* Hover effect: lift and shadow */
.cta-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.3);
}

/* Shine effect using pseudo-element */
.cta-btn::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 50%;
  height: 200%;
  background: rgba(255,255,255,0.4);
  transform: rotate(25deg);
  transition: all 0.5s ease-in-out;
  pointer-events: none;
}

.cta-btn:hover::before {
  left: 150%;
  transition: all 0.7s ease-in-out;
}

/* Optional: focus outline for accessibility */
.cta-btn:focus {
  outline: 2px solid #f4c430;
  outline-offset: 3px;
}

/* Responsive adjustment */
@media (max-width: 600px) {
  .cta-btn {
    padding: 12px 24px;
    font-size: 15px;
  }
}
</style>

</section>

<script>
const form = document.getElementById('appForm');
const resultDiv = document.getElementById('appResult');

form.addEventListener('submit', e => {
  e.preventDefault();
  const data = new FormData(form);
  const name = data.get('name');
  const email = data.get('email');
  const track = data.get('track');
  const careerPath = data.get('careerPath');
  const finance = parseInt(data.get('financeScore'));
  const analysis = parseInt(data.get('analysisScore'));
  const motivation = parseInt(data.get('motivationScore'));
  const total = finance + analysis + motivation;
  const maxScore = 15;
  const percentage = ((total/maxScore)*100).toFixed(1);

  let status = "❌ Below Threshold";
  if(percentage>=70) status = "✅ Strong Candidate";
  else if(percentage>=50) status = "⚠️ Consider for Review";

  let applicants = JSON.parse(localStorage.getItem('gsbfApplicants') || '[]');
  applicants.push({
    name,
    email,
    track,
    careerPath,
    finance,
    analysis,
    motivation,
    total,
    percentage,
    status
  });
  localStorage.setItem('gsbfApplicants', JSON.stringify(applicants));

  resultDiv.textContent = `Application Score: ${total}/${maxScore} (${percentage}%) - ${status}`;
  form.reset();
});
</script>

</body>
</html>
