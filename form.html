<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSBF Application Form</title>
<style>
:root {--gold:#f5c242;--green:#1db954;--soft:#cfd8e3;}
body{background:linear-gradient(135deg,#0b1f3a,#123c73);color:#fff;font-family:system-ui,sans-serif;padding:40px;}
.section{background:rgba(0,0,0,0.15);padding:40px;border-radius:10px;max-width:700px;margin:auto;}
h2{color:var(--gold);margin-bottom:20px;}
input,select{padding:8px;width:100%;margin-top:5px;border-radius:5px;border:1px solid #ccc;}
.btn{display:inline-block;padding:12px 25px;background:var(--gold);color:#000;font-weight:600;border-radius:6px;text-decoration:none;margin-top:15px;cursor:pointer;}
.identity-box{margin-top:20px;padding:12px;background:#eef1f5;color:#000;border-radius:8px;font-weight:600;}
</style>
</head>
<body>

<section class="section">
<h2>GSBF Application Form</h2>
<form id="appForm">
<label>Full Name:<br><input type="text" name="name" required></label><br><br>
<label>Email:<br><input type="email" name="email" required></label><br><br>

<!-- Program Track -->
<label>Program Track:<br>
<select name="track" required>
  <option value="">Select Program Track</option>
  <option value="CFFA">CFFA</option>
  <option value="CIP">CIP</option>
  <option value="CAIP">CAIP</option>
</select>
</label><br><br>

<!-- Career Pathways -->
<label>Career Pathways:<br>
<select name="careerPath" required>
  <option value="">Select Career Pathway</option>
  <option value="Investment Banking (IB)">Investment Banking (IB)</option>
  <option value="Private Equity / Venture Capital (PE/VC)">Private Equity / Venture Capital (PE/VC)</option>
  <option value="Wealth Management (WM)">Wealth Management (WM)</option>
</select>
</label><br><br>

<label>Finance Knowledge (0–5):<br><input type="number" name="financeScore" min="0" max="5" required></label><br><br>
<label>Analytical Skills (0–5):<br><input type="number" name="analysisScore" min="0" max="5" required></label><br><br>
<label>Career Motivation (0–5):<br><input type="number" name="motivationScore" min="0" max="5" required></label><br><br>

<button type="submit" class="btn">Submit Application</button>
</form>

<div id="appResult" class="identity-box">Your application score will appear here.</div>

<hr style="margin:40px 0;">
<h2>GSBF Signature Identity</h2>
<div style="background:white;padding:20px;border-radius:10px;color:#000;">
<button onclick="generateIdentity()" style="padding:10px 15px;background:black;color:white;border:none;border-radius:6px;cursor:pointer;">
Generate Identity
</button>
<div id="identityBox" class="identity-box">Your GSBF Identity will appear here</div>
<button onclick="copyIdentity()" style="margin-top:10px;padding:8px;background:#0077b5;color:white;border:none;border-radius:6px;cursor:pointer;">
Copy to LinkedIn
</button>
<br><br>
<a href="certificate.html" class="btn">View Certificate</a>
<a href="credential.html" class="btn">Digital Credential</a>
</div>

</section>

<script>
// Map short code to full program name
const programMap = {
  "CFFA": "CFFA — Certified Finance Foundations Associate",
  "CIP": "CIP — Certified Investment Professional",
  "CAIP": "CAIP — Certified Advanced Investment Practitioner"
};

const form = document.getElementById('appForm');
const resultDiv = document.getElementById('appResult');

// Handle application form submission and scoring
form.addEventListener('submit', e => {
  e.preventDefault();
  const data = new FormData(form);
  const name = data.get('name');
  const email = data.get('email');
  const trackCode = data.get('track');
  const trackFull = programMap[trackCode] || trackCode;
  const careerPath = data.get('careerPath');
  const finance = parseInt(data.get('financeScore'));
  const analysis = parseInt(data.get('analysisScore'));
  const motivation = parseInt(data.get('motivationScore'));
  const total = finance + analysis + motivation;
  const maxScore = 15;
  const percentage = ((total/maxScore)*100).toFixed(1);

  let status = "❌ Below Threshold";
  if(percentage>=70) status = "✅ Strong Candidate";
  else if(percentage>=50) status = "⚠️ Consider for Review";

  // Save applicant data in localStorage
  let applicants = JSON.parse(localStorage.getItem('gsbfApplicants') || '[]');
  applicants.push({
    name,
    email,
    track: trackFull,
    careerPath,
    finance,
    analysis,
    motivation,
    total,
    percentage,
    status
  });
  localStorage.setItem('gsbfApplicants', JSON.stringify(applicants));

  // Show result
  resultDiv.textContent = `Application Score: ${total}/${maxScore} (${percentage}%) - ${status}`;
  form.reset();
});

// GSBF Signature Identity generator
function generateIdentity(){
  const name = document.querySelector('input[name="name"]').value || "Student Name";
  const track = document.querySelector('select[name="track"]').value;
  const careerPath = document.querySelector('select[name="careerPath"]').value;
  const programFull = programMap[track] || track;
  const identity = `${name} | GSBF ${programFull} | ${careerPath}`;
  document.getElementById('identityBox').innerText = identity;

  // Store identity for certificate & digital credential
  localStorage.setItem('gsbfName', name);
  localStorage.setItem('gsbfProgram', programFull);
  localStorage.setItem('gsbfPathway', careerPath);
  localStorage.setItem('gsbfIdentity', identity);
}

// Copy to LinkedIn button
function copyIdentity(){
  const identity = localStorage.getItem('gsbfIdentity') || "";
  navigator.clipboard.writeText(identity);
  alert("✅ GSBF Identity copied! You can paste it on LinkedIn.");
}
</script>

</body>
</html>
