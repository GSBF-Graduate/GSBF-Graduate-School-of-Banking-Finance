<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSBF Certificate</title>

<style>
:root{
  --gold:#f5c242;
  --navy:#123c73;
  --deep:#0b1f3a;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:40px 20px;
  background:linear-gradient(135deg,var(--navy),var(--deep));
  font-family:'Georgia',serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* OUTER WRAPPER (Prevents border cut-off) */
.certificate-wrapper{
  width:100%;
  max-width:950px;
  padding:20px; /* ensures border never touches screen */
}

/* MAIN CERTIFICATE */
.certificate{
  position:relative;
  width:100%;
  background:var(--white);
  border:10px solid var(--gold);
  border-radius:18px;
  padding:70px 60px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.35);
  overflow:hidden;
}

/* Logo */
.logo{
  width:120px;
  margin-bottom:15px;
}

/* Watermark */
.watermark{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(-20deg);
  font-size:140px;
  font-weight:bold;
  color:var(--gold);
  opacity:0.06;
  pointer-events:none;
  white-space:nowrap;
}

/* Headings */
.certificate h1{
  font-size:38px;
  color:var(--gold);
  margin-bottom:10px;
}

.certificate h2{
  font-size:28px;
  margin:18px 0;
}

.certificate p{
  font-size:18px;
  margin:10px 0;
}

/* Certificate ID */
.cert-id{
  margin-top:10px;
  font-size:14px;
  color:var(--navy);
  font-weight:bold;
}

/* QR Code */
.qr{
  margin-top:25px;
}

/* Signatures */
.signatures{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-top:70px;
  gap:20px;
}

.signature-block{
  text-align:center;
  flex:1;
}

.signature-img{
  height:60px;
  margin-bottom:5px;
  object-fit:contain;
}

.signature-line{
  border-top:2px solid #000;
  width:200px;
  margin:8px auto 0 auto;
}
</style>
</head>

<body>

<div class="certificate-wrapper">
  <div class="certificate">

    <div class="watermark">GSBF</div>

    <!-- ADD YOUR LOGO FILE NAME HERE -->
    <img src="logo.png" class="logo" alt="GSBF Logo">

    <h1>Certificate of Achievement</h1>

    <p>This certifies that</p>
    <h2 id="certName">[Applicant Name]</h2>

    <p>has successfully completed the</p>
    <h2 id="certTrack">[Program Track]</h2>

    <p>Career Pathway: <strong id="certCareer">[Career Pathway]</strong></p>

    <p>GSBF Signature Identity:</p>
    <p id="signatureIdentity" style="font-weight:bold;color:#123c73;"></p>

    <div class="cert-id" id="certificateID"></div>

    <div class="qr">
      <canvas id="qrCode"></canvas>
    </div>

    <div class="signatures">

      <!-- Program Director -->
      <div class="signature-block">
        <img src="director-signature.png" class="signature-img" alt="Director Signature">
        <div class="signature-line"></div>
        <p>Program Director</p>
      </div>

      <!-- Date -->
      <div class="signature-block">
        <div class="signature-line"></div>
        <p id="certDate"></p>
      </div>

    </div>

  </div>
</div>

<!-- QR Code Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
let applicants = JSON.parse(localStorage.getItem('gsbfApplicants') || '[]');

if(applicants.length > 0){

  let latest = applicants[applicants.length - 1];

  document.getElementById('certName').textContent = latest.name;
  document.getElementById('certTrack').textContent = latest.track;
  document.getElementById('certCareer').textContent = latest.careerPath;

  document.getElementById('signatureIdentity').textContent =
    `${latest.name} | GSBF ${latest.track} | ${latest.careerPath}`;

  /* Auto Certificate ID */
  let certificateID = "GSBF-" + Date.now().toString().slice(-8);
  document.getElementById('certificateID').textContent = "Certificate ID: " + certificateID;

  /* Date */
  let today = new Date();
  document.getElementById('certDate').textContent = today.toLocaleDateString();

  /* QR Code */
  let verificationURL = "https://yourdomain.com/verify?id=" + certificateID;

  QRCode.toCanvas(document.getElementById('qrCode'), verificationURL, {
    width:120
  });
}
</script>

</body>
</html>
