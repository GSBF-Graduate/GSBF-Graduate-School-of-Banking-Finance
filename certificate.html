<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSBF Certificate</title>
<style>
:root{--gold:#f5c242;}
body{background:#123c73;font-family:system-ui,sans-serif;padding:40px;color:#000;}
.section{max-width:800px;margin:auto;}
.card{background:#fff;padding:40px;border:5px solid var(--gold);border-radius:15px;text-align:center;position:relative;}
.card .watermark{opacity:0.1;font-size:100px;position:absolute;top:30px;left:50%;transform:translateX(-50%);}
h2{color:var(--gold);}
</style>
</head>
<body>

<section class="section">
<h2>Certificate Mockup</h2>
<div class="card" id="certificateCard">
<div class="watermark">GSBF</div>
<h2>Certificate of Achievement</h2>
<p>This certifies that</p>
<h3 id="certName">[Applicant Name]</h3>
<p>has successfully completed the</p>
<h3 id="certTrack">[Program Track]</h3>
<p>Career Pathway: <span id="certCareer">[Career Pathway]</span></p>
<p>with outstanding performance and professional distinction.</p>

<div style="margin-top:40px;display:flex;justify-content:space-between;padding:0 50px;">
<div>
<p>Program Director</p>
<div style="border-top:1px solid #000;width:120px;margin-top:5px;"></div>
</div>
<div>
<p>Date</p>
<div style="border-top:1px solid #000;width:100px;margin-top:5px;"></div>
</div>
</div>
</div>
</section>

<script>
let applicants = JSON.parse(localStorage.getItem('gsbfApplicants') || '[]');
if(applicants.length>0){
  let latest = applicants[applicants.length-1];
  document.getElementById('certName').textContent = latest.name;
  document.getElementById('certTrack').textContent = latest.track || "N/A";
  document.getElementById('certCareer').textContent = latest.careerPath;
}
</script>

</body>
</html>
